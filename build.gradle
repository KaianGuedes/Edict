plugins {
    id 'java'
}

group = 'dev.war'
version = plugin_version

repositories {
    mavenCentral()
    maven {
        name = "spigot-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

// Spigot API is the baseline; Paper-only code lives in its own source set and is only loaded when Paper is detected.
def brandDir = layout.buildDirectory.dir('generated/brand')

sourceSets {
    main {
        java.srcDir brandDir
    }
    paper {
        java.srcDir 'src/paper/java'
    }
    selftest {
        java.srcDir 'src/selftest/java'
    }
}

configurations {
    paperApi
}

dependencies {
    compileOnly("org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT")
    paperApi("io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT")
    selftestCompileOnly("org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT")
    selftestCompileOnly(sourceSets.main.output)
}

java {
    // 1.20.1 servers run Java 17, so everything is compiled for 17
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    disableAutoTargetJvm()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
}

tasks.named('compilePaperJava') {
    classpath = files(sourceSets.main.output) + configurations.paperApi
    dependsOn tasks.named('classes')
}

processResources {
    def props = [name: plugin_name, version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

jar {
    archiveBaseName = plugin_name
    from sourceSets.paper.output
    // Paper 1.20.5+ would remap a plain Spigot plugin; this one uses no obfuscated names, so it opts out
    manifest {
        attributes('paperweight-mappings-namespace': 'mojang')
    }
}

// harness plugin used only by the test servers (never shipped)
tasks.register('selftestJar', Jar) {
    archiveBaseName = plugin_name + 'SelfTest'
    from sourceSets.selftest.output
    destinationDirectory = layout.buildDirectory.dir('libs')
}

tasks.named('build') { dependsOn 'selftestJar', 'compilePaperJava' }

// dev.war.edict.Brand: the plugin name in one place (gradle.properties)
tasks.register('generateBrand') {
    def out = brandDir
    def n = plugin_name
    def legacy = plugin_legacy_name
    inputs.property('name', n)
    inputs.property('legacy', legacy)
    outputs.dir(out)
    doLast {
        def f = out.get().file('dev/war/edict/Brand.java').asFile
        f.parentFile.mkdirs()
        f.text = "package dev.war.edict;\n\n/** Generated from gradle.properties. */\npublic final class Brand {\n    public static final String NAME = \"${n}\";\n    public static final String LEGACY_NAME = \"${legacy}\";\n\n    private Brand() {\n    }\n}\n"
    }
}
tasks.named('compileJava') { dependsOn 'generateBrand' }
