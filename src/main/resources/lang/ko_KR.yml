        - "&7침대 등의 폭발에서도 보호합니다."
  enderman_block_theft:
    allow-place:
      name: "&a블록 놓기 허용"
      desc:
        - "&7꺼짐: 엔더맨이 들고 있는"
        - "&7블록도 놓을 수 없습니다."
