      name: "&a차단 메시지"
      desc:
        - "&7차원문이 차단될 때 전송됩니다."
        - "&7비워 두면 기본 문구를 사용합니다."
  safe_void_fall:
    the-end-y:
      name: "&a발동 Y (디 엔드)"
      desc:
        - "&7플레이어를 오버월드로 보내는"
        - "&7엔드의 높이입니다."
    overworld-y:
      name: "&a도착 Y (오버월드)"
      desc:
        - "&7도착 높이입니다. 목적지의 건축"
        - "&7가능 높이로 제한됩니다."
    max-height-margin:
      name: "&a높이 여유"
      desc:
