# Повідомлення Edict (українська). Кольори задаються кодами &. {змінні} підставляє плагін.
log:
  enabled: "Edict успішно ввімкнено! (платформа: {platform})"
  disabled: "Edict вимкнено."
err:
  bool: "&cЗначення має бути true або false."
  number: "&cЗначення має бути цілим числом."
  range: "&cЗначення має бути від {min} до {max}."
value:
  "on": "&aУВІМК"
  "off": "&cВИМК"
  empty: "&8(порожньо)"
source:
  default: "&8[за замовчуванням]"
  own: "&8[задано тут]"
  inherited: "&8[успадковано від {scope}&8]"
scope:
  global: "Глобально"
  overworld: "Верхній світ"
  nether: "Незер"
  the_end: "Енд"
  world: "Світ {name}"
cmd:
  no-permission: "&cУ вас немає дозволу на використання цієї команди."
  players-only: "&cВідкрити меню можуть лише гравці."
  reload: "&aКонфігурацію та мовні файли перезавантажено."
  bad-scope: "&cНевідома область '{scope}'. Використовуйте global, overworld, nether, the_end або world:<назва>."
  rule-not-found: "&cПравило '{rule}' не знайдено."
  usage:
    get: "&eВикористання: /edict get <правило> [параметр] [область]"
    set: "&eВикористання: /edict set <правило> [параметр] <значення> [область]"
    reset: "&eВикористання: /edict reset <правило> [параметр] [область]"
  help:
    header: "&e--- Edict ---"
    lines:
      - "&7/{label} &8- &fвідкрити меню (гравці)"
      - "&7/{label} list [область] &8- &fпоказати всі правила"
      - "&7/{label} get <правило> [параметр] [область] &8- &fпоказати значення"
      - "&7/{label} set <правило> [параметр] <значення> [область] &8- &fзмінити значення"
      - "&7/{label} reset <правило> [параметр] [область] &8- &fприбрати перевизначення"
      - "&7/{label} reload &8- &fперечитати конфігурацію та мови"
      - "&7Області: &fglobal, overworld, nether, the_end, world:<назва>"
  list:
    header: "&a--- Поточні правила ({scope}&a) ---"
    rule: "&e{rule}"
    param: "&7  {param}: {value} {source}"
  get: "&7{rule}.{param} = {value} &7в області {scope} {source}"
  set:
    ok: "&aПравило {rule} ({param}) встановлено на {value}&a в області {scope}&a."
  reset:
    ok: "&aПравило {rule} ({param}) скинуто в області {scope}&a."
prompt:
  ask: "&eВведіть у чат нове значення для &f{param}&e або напишіть &fскасувати&e."
  cancelled: "&7Скасовано."
  cancel-word: "скасувати"
  saved: "&a{param} встановлено на {value}."
rule:
  creeper_block_damage:
    name: "&aРуйнування блоків кріпером"
    desc:
      - "&7Визначає, чи можуть вибухи"
      - "&7кріперів руйнувати блоки."
      - "&7Вимк: вибух завдає шкоди, але"
      - "&7місцевість лишається цілою."
  enderman_block_theft:
    name: "&aКрадіжка блоків ендерменом"
    desc:
      - "&7Визначає, чи можуть ендермени"
      - "&7брати блоки (траву, пісок тощо)."
  enter_end_portal:
    name: "&aВхід у портал в Енд"
    desc:
      - "&7Визначає, чи можуть гравці входити"
      - "&7в портали в Енд. Вимк: телепортацію"
      - "&7скасовано, а досягнення «Енд?»"
      - "&7не зараховується."
    blocked: "&cПортал в Енд тут вимкнено."
  safe_void_fall:
    name: "&aБезпечне падіння в безодню"
    desc:
      - "&7ЛИШЕ ЕНД: безодня Енду веде в небо"
      - "&7Верхнього світу. Падіння з Енду ніколи"
      - "&7не вбиває; гравець потрапляє у"
      - "&7відповідний Верхній світ."
param:
  enabled:
    name: "&aУвімкнено"
    desc:
      - "&7Вмикає або вимикає правило."
  creeper_block_damage:
    also-other-explosions:
      name: "&aІнші вибухи також"
      desc:
        - "&7За вимкненого правила захищає"
        - "&7блоки й від ТНТ, гастів, ліжок тощо."
  enderman_block_theft:
    allow-place:
      name: "&aДозволити ставити блоки"
      desc:
        - "&7Вимк: ендермени не зможуть"
        - "&7поставити й блок, який несуть."
  enter_end_portal:
    message:
      name: "&aПовідомлення про заборону"
      desc:
        - "&7Надсилається, коли портал закрито."
        - "&7Порожньо: текст за замовчуванням."
  safe_void_fall:
    the-end-y:
      name: "&aРівень Y спрацювання (Енд)"
      desc:
        - "&7Висота в Енді, на якій гравця"
        - "&7відправляють у Верхній світ."
    overworld-y:
      name: "&aРівень Y прибуття (Верх. світ)"
      desc:
        - "&7Висота прибуття. Обмежується"
        - "&7висотою будівництва призначення."
    max-height-margin:
      name: "&aЗапас за висотою"
      desc:
        - "&7Вільні блоки під лімітом висоти,"
        - "&7якщо Y обмежено."
    fall-damage:
      name: "&aШкода від падіння після прибуття"
      desc:
        - "&7Увімк: діє звичайна шкода від падіння."
        - "&7Вимк: після прибуття шкоди немає."
    keep-velocity:
      name: "&aЗберігати швидкість"
      desc:
        - "&7Увімк: швидкість падіння зберігається"
        - "&7після телепортації. Вимк: падіння з нуля."
gui:
  title:
    main: "Edict"
    rule: "Edict: {rule}"
    scope: "Edict: вибір області"
  close: "&cЗакрити"
  back: "&eНазад"
  current: "&7{scope}&7: {value}"
  default: "&7За замовчуванням: {value}"
  range: "&7Діапазон: &f{min} &7до &f{max}"
  per-scope: "&7Увімкнено за областями:"
  per-scope-line: "&8  {scope}&8: {value}"
  override:
    "yes": "&7Перевизначення в цій області: &aтак"
    "no": "&7Перевизначення в цій області: &8ні (успадковується)"
  rule:
    controls:
      - "&eЛКМ: &fвідкрити налаштування"
      - "&eПКМ: &fувімкнути/вимкнути"
  controls:
    bool:
      - "&eКлік: &fперемкнути"
    int:
      - "&eЛКМ/ПКМ: &f+/- {step}"
      - "&eShift + клік: &f+/- {big}"
      - "&eQ (викинути): &fввести точне значення"
    string:
      - "&eЛКМ: &fввести значення в чаті"
      - "&eПКМ: &fочистити"
    reset:
      - "&eСКМ: &fприбрати перевизначення (успадкувати)"
    reset-global:
      - "&eСКМ: &fповернути значення за замовчуванням"
  scope:
    button: "&bОбласть"
    current: "&7Редагування: &f{scope}"
    lore:
      - "&7Порядок: світ, потім вимір,"
      - "&7потім глобально."
      - "&eНатисніть, щоб змінити"
    header: "&bВибір області"
    header-lore:
      - "&7Виберіть, де діють зміни."
    select: "&eНатисніть, щоб вибрати"
    selected: "&aВибрано"
    entry:
      global:
        - "&7Значення за замовчуванням для всіх світів."
      environment:
        - "&7Усі світи цього типу виміру."
      world:
        - "&7Лише цей світ."
