# Сообщения Edict (русский). Цвета задаются кодами &. {переменные} подставляет плагин.
log:
  enabled: "Edict успешно включён! (платформа: {platform})"
  disabled: "Edict отключён."
err:
  bool: "&cЗначение должно быть true или false."
  number: "&cЗначение должно быть целым числом."
  range: "&cЗначение должно быть от {min} до {max}."
value:
  "on": "&aВКЛ"
  "off": "&cВЫКЛ"
  empty: "&8(пусто)"
source:
  default: "&8[по умолчанию]"
  own: "&8[задано здесь]"
  inherited: "&8[унаследовано от {scope}&8]"
scope:
  global: "Глобально"
  overworld: "Верхний мир"
  nether: "Нижний мир"
  the_end: "Энд"
  world: "Мир {name}"
cmd:
  no-permission: "&cУ вас нет прав на использование этой команды."
  players-only: "&cОткрыть меню могут только игроки."
  reload: "&aКонфигурация и языковые файлы перезагружены."
  bad-scope: "&cНеизвестная область '{scope}'. Используйте global, overworld, nether, the_end или world:<имя>."
  rule-not-found: "&cПравило '{rule}' не найдено."
  usage:
    get: "&eИспользование: /edict get <правило> [параметр] [область]"
    set: "&eИспользование: /edict set <правило> [параметр] <значение> [область]"
    reset: "&eИспользование: /edict reset <правило> [параметр] [область]"
  help:
    header: "&e--- Edict ---"
    lines:
      - "&7/{label} &8- &fоткрыть меню (игроки)"
      - "&7/{label} list [область] &8- &fпоказать все правила"
      - "&7/{label} get <правило> [параметр] [область] &8- &fпоказать значение"
      - "&7/{label} set <правило> [параметр] <значение> [область] &8- &fизменить значение"
      - "&7/{label} reset <правило> [параметр] [область] &8- &fубрать переопределение"
      - "&7/{label} reload &8- &fперечитать конфигурацию и языки"
      - "&7Области: &fglobal, overworld, nether, the_end, world:<имя>"
  list:
    header: "&a--- Текущие правила ({scope}&a) ---"
    rule: "&e{rule}"
    param: "&7  {param}: {value} {source}"
  get: "&7{rule}.{param} = {value} &7в области {scope} {source}"
  set:
    ok: "&aПравило {rule} ({param}) установлено в {value}&a в области {scope}&a."
  reset:
    ok: "&aПравило {rule} ({param}) сброшено в области {scope}&a."
prompt:
  ask: "&eВведите в чат новое значение для &f{param}&e или напишите &fотмена&e."
  cancelled: "&7Отменено."
  cancel-word: "отмена"
  saved: "&a{param} установлено в {value}."
rule:
  creeper_block_damage:
    name: "&aРазрушение блоков крипером"
    desc:
      - "&7Определяет, могут ли взрывы"
      - "&7криперов разрушать блоки."
      - "&7Выкл: взрыв наносит урон, но"
      - "&7местность остаётся целой."
  enderman_block_theft:
    name: "&aКража блоков эндерменом"
    desc:
      - "&7Определяет, могут ли эндермены"
      - "&7брать блоки (траву, песок и т. д.)."
  enter_end_portal:
    name: "&aВход в портал в Энд"
    desc:
      - "&7Определяет, могут ли игроки входить"
      - "&7в порталы в Энд. Выкл: телепортация"
      - "&7отменяется, а достижение «Энд?»"
      - "&7не засчитывается."
    blocked: "&cПортал в Энд здесь отключён."
  safe_void_fall:
    name: "&aБезопасное падение в бездну"
    desc:
      - "&7ТОЛЬКО ЭНД: бездна Энда ведёт в небо"
      - "&7Верхнего мира. Падение из Энда никогда"
      - "&7не убивает; игрок попадает в"
      - "&7соответствующий Верхний мир."
param:
  enabled:
    name: "&aВключено"
    desc:
      - "&7Включает или выключает правило."
  creeper_block_damage:
    also-other-explosions:
      name: "&aДругие взрывы тоже"
      desc:
        - "&7При выключенном правиле защищает"
        - "&7блоки и от ТНТ, гастов, кроватей и др."
  enderman_block_theft:
    allow-place:
      name: "&aРазрешить ставить блоки"
      desc:
        - "&7Выкл: эндермены не смогут"
        - "&7поставить и несомый блок."
  enter_end_portal:
    message:
      name: "&aСообщение о запрете"
      desc:
        - "&7Отправляется, когда портал закрыт."
        - "&7Пусто: используется текст по умолчанию."
  safe_void_fall:
    the-end-y:
      name: "&aУровень Y срабатывания (Энд)"
      desc:
        - "&7Высота в Энде, на которой игрока"
        - "&7отправляют в Верхний мир."
    overworld-y:
      name: "&aУровень Y прибытия (Верх. мир)"
      desc:
        - "&7Высота прибытия. Ограничивается"
        - "&7высотой строительства назначения."
    max-height-margin:
      name: "&aЗапас по высоте"
      desc:
        - "&7Свободные блоки под лимитом высоты,"
        - "&7если Y ограничен."
    fall-damage:
      name: "&aУрон от падения после прибытия"
      desc:
        - "&7Вкл: действует обычный урон от падения."
        - "&7Выкл: после прибытия урона нет."
    keep-velocity:
      name: "&aСохранять скорость"
      desc:
        - "&7Вкл: скорость падения сохраняется после"
        - "&7телепортации. Выкл: падение с нуля."
gui:
  title:
    main: "Edict"
    rule: "Edict: {rule}"
    scope: "Edict: выбор области"
  close: "&cЗакрыть"
  back: "&eНазад"
  current: "&7{scope}&7: {value}"
  default: "&7По умолчанию: {value}"
  range: "&7Диапазон: &f{min} &7до &f{max}"
  per-scope: "&7Включено по областям:"
  per-scope-line: "&8  {scope}&8: {value}"
  override:
    "yes": "&7Переопределение в этой области: &aда"
    "no": "&7Переопределение в этой области: &8нет (наследуется)"
  rule:
    controls:
      - "&eЛКМ: &fоткрыть настройки"
      - "&eПКМ: &fвключить/выключить"
  controls:
    bool:
      - "&eКлик: &fпереключить"
    int:
      - "&eЛКМ/ПКМ: &f+/- {step}"
      - "&eShift + клик: &f+/- {big}"
      - "&eQ (выбросить): &fввести точное значение"
    string:
      - "&eЛКМ: &fввести значение в чате"
      - "&eПКМ: &fочистить"
    reset:
      - "&eСКМ: &fубрать переопределение (наследовать)"
    reset-global:
      - "&eСКМ: &fвернуть значение по умолчанию"
  scope:
    button: "&bОбласть"
    current: "&7Редактирование: &f{scope}"
    lore:
      - "&7Порядок: мир, затем измерение,"
      - "&7затем глобально."
      - "&eНажмите, чтобы изменить"
    header: "&bВыбор области"
    header-lore:
      - "&7Выберите, где действуют изменения."
    select: "&eНажмите, чтобы выбрать"
    selected: "&aВыбрано"
    entry:
      global:
        - "&7Значение по умолчанию для всех миров."
      environment:
        - "&7Все миры этого типа измерения."
      world:
        - "&7Только этот мир."
