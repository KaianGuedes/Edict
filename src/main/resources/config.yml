# Edict 0.2
#
# Every rule has parameters. A value is resolved per parameter in this order:
#   1. worlds.<world name>.<rule>.<parameter>
#   2. environments.<overworld|nether|the_end>.<rule>.<parameter>
#   3. rules.<rule>.<parameter>   (global default)
# You can edit this file, use /edict set, or use the GUI (/edict). /edict reload re-reads it.

config-version: 2

# Language of messages and the GUI: auto (client language, else the server language), en_US or pt_BR.
language: auto

rules:
  # Stops explosions from breaking blocks.
  creeper_block_damage:
    # true  = vanilla (creepers break blocks), false = the explosion hurts but the terrain stays intact.
    enabled: true
    # When enabled is false, also protect blocks from other explosions (TNT, ghasts, withers, beds, anchors...).
    also-other-explosions: false

  # Controls whether endermen can pick up blocks.
  enderman_block_theft:
    # true  = vanilla, false = endermen cannot take blocks.
    enabled: true
    # false = endermen also cannot place the block they carry.
    allow-place: true

  # Controls travel through End portals.
  enter_end_portal:
    # true  = vanilla, false = the teleport is cancelled (the player never changes dimension).
    enabled: true
    # Message sent to the player when the portal is blocked. Empty = the translated default. Supports & colors.
    message: ""

  # ONLY THE END: the End void leads to the Overworld sky.
  # With this on, falling out of the End never kills. Below the-end-y the player is sent to the matching
  # overworld (see corresponding-overworld below) at overworld-y.
  safe_void_fall:
    enabled: false
    # Y level in the End that triggers the teleport.
    the-end-y: -200
    # Arrival Y in the overworld. It is clamped to that world's build height minus max-height-margin,
    # and a warning is logged when that happens.
    overworld-y: 1624
    max-height-margin: 8
    # true = vanilla fall damage applies after arrival, false = no fall damage after arriving.
    fall-damage: true
    # true = keep the falling speed after the teleport, false = start the fall from rest.
    keep-velocity: false

# Overrides per environment group. Example:
#   environments:
#     nether:
#       creeper_block_damage:
#         enabled: false
environments:
  overworld: {}
  nether: {}
  the_end: {}

# Overrides per world (by world name). Example:
#   worlds:
#     creative_world:
#       enter_end_portal:
#         enabled: false
worlds: {}

# Which overworld an End world sends players to (safe_void_fall).
# Without an entry, the standard naming is used: world_the_end -> world, <name>_the_end -> <name>.
# If nothing matches, the main world is used and a warning is logged. Example:
#   corresponding-overworld:
#     my_end: my_overworld
corresponding-overworld: {}
